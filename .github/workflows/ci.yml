name: ci

# One job, deliberately. An R job, a nightly job and a coverage threshold are out of scope here.
# What this proves is narrow and worth proving: the package builds and its fast suite passes
# on every interpreter the metadata claims to support.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor `requires-python` declares, the version between, and the version this is
        # developed on. The floor is not decoration: some syntax is legal only from 3.12, so a
        # 3.11 claim that nothing exercises can silently become false. The top is here for the
        # converse reason - a version the classifiers advertise must be one something runs.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package and the test runner
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      # `make check` runs the same steps as locally: lint (ruff check + format), types
      # (mypy), arch (lint-imports), test. CI runs the target rather than a hand-copied
      # subset, so the two cannot drift.
      #
      # Invariant: no step here fetches data/real_private/, and none may be added.
      #
      # What keeps the suite green without that tree is per-test `pytest.skip` on the absent
      # path, NOT the marker selector. Nine tests carry `real`, and `real` is deliberately
      # NOT excluded from the fast selector: the marker is local bookkeeping, and the runner
      # having no tree is the enforcement.
      - name: make check
        run: make check

      - name: make deps
        run: make deps

      # Printed, never enforced: no fail_under, no diff against a previous run, no external
      # service. It is here so a module executing code nothing checks stays visible.
      # `continue-on-error` so a later `fail_under` in config cannot quietly make it fail the build.
      #
      # Runs the TARGET rather than a copy of its command, for the same reason `make check`
      # above does. `cov` depends on `require-selector`, which is what stops an empty
      # selector file running every excluded tier, and the selector and data state come from
      # the target's own output, so both are measured here rather than asserted by this file.
      #
      # `tee` yields its own exit status, not the pipeline's, so a failed run would otherwise
      # leave an empty fenced block and no explanation. PIPESTATUS is read and reported
      # instead of `set -o pipefail`, which under `bash -e` would abort before the fence is
      # closed and leave the summary with an unterminated code block.
      - name: coverage (reported, never enforced)
        continue-on-error: true
        run: |
          {
            echo "### Coverage - python ${{ matrix.python-version }}"
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          make cov 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          rc=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          [ "$rc" -eq 0 ] || echo "make cov exited $rc" >> "$GITHUB_STEP_SUMMARY"
