[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quebra"
version = "0.1.0.dev0"
description = "Reliability statistics for qubit quality time series"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{ name = "Sera Conti", email = "sera.conti@usp.br" }]
keywords = ["qubit", "reliability", "survival analysis", "reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
]

# Derived from the imports actually present under src/quebra/, not copied from a
# requirements file. Lower bounds only, set to the versions this was developed against.
#
dependencies = [
  "numpy>=2.0",
  # 1.15 for `scipy.stats.chatterjeexi`, which its release notes list as new there: below it
  # the tier-4 cross-check in tests/test_r_cross_implementation.py skips instead of failing.
  # CI resolves newest on every leg, so no gate exercises this floor.
  "scipy>=1.15",
  "pandas>=2.2",
  "matplotlib>=3.9",
  "plotly>=6.0",
  "pandera>=0.20",
  "allantools>=2024.6",
  "scikit-learn>=1.5",
  "h5py>=3.11",
  "PyYAML>=6.0",
  "platformdirs>=4.0",
  "grimp>=3.0",
  # Preconditions for HARD computational invariants only, per spec/quebraplan.md 4.2 and
  # spec/specvalidity08.md R8.5b. Scoped deliberately: see the BOUNDARY note there and
  # tests/test_contract_boundary.py, which keeps it out of analyzers/checks/.
  "icontract>=2.7",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "import-linter>=2.13",
  "deptry>=0.20",
  "build>=1.2",
]
# placeholder for now
r = []
bench = ["joblib>=1.3"]

[project.urls]
Homepage = "https://github.com/seraconti/quebra"
Repository = "https://github.com/seraconti/quebra"
Issues = "https://github.com/seraconti/quebra/issues"

[project.scripts]
quebra = "quebra.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quebra"]

[tool.hatch.build.targets.sdist]
exclude = [
  "output/",
  "output_backup*/",
  "spec/ledger/",
  ".claude/",
  "dist/",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.format]
# Fenced blocks in docs/ are fragments, not modules. Formatting them rewrites their
# meaning - a trailing-comma argument list becomes a one-tuple assignment.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
# Two orthogonal axes: tier (exactly one per test) and cost (zero or more).
markers = [
  "unit: does this function do the small thing it claims",
  "properties: mathematical invariants under generated inputs",
  "statistical: is the estimator correct, against a named oracle",
  "integration: does the machinery wire up",
  "validation: does an end-to-end job reach the right verdict on known truth",
  "regression: did a refactor move a published number",
  "policy: does the source tree obey a rule we wrote down",
  "slow: full statistical grids; excluded from the fast gate",
  "heavy: large end-to-end job runs; excluded from the fast gate",
  "real: needs the private dataset tree; CI has none, so these skip there",
  "r: needs Rscript and the copula package, which is all c3_serial_copula.R calls",
]

[tool.importlinter]
root_package = "quebra"
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
  "quebra.cli",
  "quebra.recipes",
  "quebra.panels",
  "quebra.plots",
  "quebra.analyzers",
  "quebra.transforms",
  "quebra.schemas",
  "quebra.loaders",
  "quebra.core",
  "quebra.provenance",
  "quebra._fixtures",
]

ignore_imports = [
  "quebra.core.job -> quebra.loaders.registry",
  "quebra.core.job -> quebra.schemas.ramsey_series",
  "quebra.core.runner -> quebra.plots.targets",
  "quebra.analyzers.fidelity -> quebra.plots.theme",
  "quebra.schemas.ramsey_series -> quebra.transforms.lookup_prior",
]

[tool.mypy]
# 3.12, not the 3.11 floor: numpy's stubs use `type` statements, which mypy refuses to
# parse against an older target and then checks nothing. The 3.11 test leg guards
# runtime compatibility.
python_version = "3.12"


# `make types` checks core/ and says so. Without this, mypy follows core's imports out of
# the tree and reports errors in modules the scope excludes, so whether the gate passes
# depends on how the package happens to be installed. Their types are still read; only
# their own errors are silenced. Widening the scope is what removes these entries.
[[tool.mypy.overrides]]
module = [
  "quebra._fixtures.*",
  "quebra.analyzers.*",
  "quebra.cli",
  "quebra.loaders.*",
  "quebra.panels.*",
  "quebra.plots.*",
  "quebra.provenance",
  "quebra.recipes",
  "quebra.schemas.*",
  "quebra.transforms.*",
]
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true

[tool.deptry]
# Declare `quebra` first-party; the scan itself is repo-wide (`deptry .`, 107 files). `jobs/`
# and `tests/` live at the repository root by design  and legitimately import
# `quebra`; without this declaration deptry reads those as  "transitive dependency" on
# the project's own name, which is noise.
known_first_party = ["quebra"]

[tool.deptry.per_rule_ignores]
# DEP002 is "declared but never imported".
# Listing them here states that on purpose, so a genuinely unused runtime dependency still surfaces
DEP002 = [
  "ruff",
  "mypy",
  "pytest",
  # Imported by nothing: it is a pytest plugin, reached via `make cov`'s --cov flag.
  "pytest-cov",
  "import-linter",
  "deptry",
  "build",
]
